<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Gestion des Pannes BDOM</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Connexion BDOM</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" required placeholder="Ex: agent_kadutu">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit">Se connecter</button>
        <p id="errorMessage" class="error"></p>
    </form>
</div>

<script>
    // Adresse locale du serveur Django pour vos tests
    const API_URL = "http://127.0.0.1:8000/api/";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const errorElement = document.getElementById('errorMessage');

        errorElement.textContent = "";

        try {
            const response = await fetch(`${API_URL}token/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: usernameInput,
                    password: passwordInput
                })
            });

            if (response.ok) {
                const data = await response.json();
                
                // Enregistrement des jetons JWT et du nom d'utilisateur
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('username', usernameInput);

                // Redirection vers le tableau de bord
                window.location.href = "index.html";
            } else {
                errorElement.textContent = "Identifiant ou mot de passe incorrect.";
            }
        } catch (err) {
            errorElement.textContent = "Impossible de contacter le serveur Django.";
        }
    });
</script>

</body>
</html>
